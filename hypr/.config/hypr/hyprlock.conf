# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = Adwaita

# Catppuccin Mocha
$base = 1e1e2e
$surface0 = 313244
$overlay0 = 6c7086
$text = cdd6f4
$mauve = cba6f7
$blue = 89b4fa
$red = f38ba8
$peach = fab387
$base_alpha = 1e1e2ecc
$mauve_alpha = cba6f7ee
$blue_alpha = 89b4faee
$red_alpha = f38ba8ee
$peach_alpha = fab387ee

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba($base_alpha)

    outer_color = rgba($mauve_alpha) rgba($blue_alpha) 45deg
    check_color = rgba($blue_alpha) rgba($mauve_alpha) 120deg
    fail_color = rgba($red_alpha) rgba($peach_alpha) 40deg

    font_color = rgb($text)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME12 # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font
    color = rgb($text)

    position = 0, -160
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d %Y" # update every 60 seconds
    font_size = 25
    font_family = $font
    color = rgb($text)

    position = 0, -320
    halign = center
    valign = top
}

label {
    monitor =
    text = $LAYOUT[en,ru]
    font_size = 24
    color = rgb($overlay0)
    onclick = hyprctl switchxkblayout all next

    position = 230, -20
    halign = center
    valign = center
}
